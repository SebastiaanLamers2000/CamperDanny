<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5efe3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14191a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Camper Danny">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Camper Danny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
/* layout: één schermvullende app; vijf tabs onderaan (Start, Kaart, Tijdlijn, Agenda, To-do), de actieve pagina erboven */
:root{
  --bg:#f5efe3; --surface:#fffcf5; --ink:#232b27; --muted:#6b756f; --line:#e3dac6;
  --accent:#1d6b64; --accent-ink:#ffffff; --orange:#d9742b; --violet:#7a6fa8; --green:#5b8f4a;
  --sea:#cfe2e4; --land:#eadfc6; --land-line:#c9bb98; --border:#a8986f; --danger:#b3392f; --shadow:0 6px 24px rgba(40,34,20,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14191a; --surface:#1d2425; --ink:#e8ece7; --muted:#97a39c; --line:#2c3638;
    --accent:#4fb3a8; --accent-ink:#0c1514; --orange:#ef9250; --violet:#a198d6; --green:#86bb73;
    --sea:#1a2a2f; --land:#2b332f; --land-line:#44504a; --border:#6d7c73; --danger:#e8675c; --shadow:0 6px 24px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14191a; --surface:#1d2425; --ink:#e8ece7; --muted:#97a39c; --line:#2c3638;
  --accent:#4fb3a8; --accent-ink:#0c1514; --orange:#ef9250; --violet:#a198d6; --green:#86bb73;
  --sea:#1a2a2f; --land:#2b332f; --land-line:#44504a; --border:#6d7c73; --danger:#e8675c; --shadow:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3{font-family:"Fraunces",Georgia,"Times New Roman",serif;margin:0;font-weight:700;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
header .ttl{flex:1;min-width:0}
header h1{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12px;color:var(--muted)}
.kmbadge{text-align:right;line-height:1.1}
.kmbadge b{font-family:"Fraunces",Georgia,serif;font-size:22px;color:var(--accent)}
.kmbadge span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:16px}
#main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;padding:14px 16px 96px;-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:1px solid var(--line);background:var(--surface)}
nav button{flex:1;border:0;background:none;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent);font-weight:600}
.fab{position:absolute;right:16px;bottom:16px;z-index:5;border:0;background:var(--accent);color:var(--accent-ink);height:52px;padding:0 20px;border-radius:26px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;font-size:15px}
.fab svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}

/* map */
#mapwrap{flex:1;position:relative;overflow:hidden;touch-action:none;background:var(--sea);cursor:grab}
#mapsvg{width:100%;height:100%;display:block}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.bord{fill:none;stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.clab{fill:var(--muted);stroke:var(--land);paint-order:stroke;stroke-linejoin:round;pointer-events:none;font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-weight:600;opacity:.85}
.city{fill:var(--ink);stroke:var(--land);paint-order:stroke;stroke-linejoin:round;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.city.t1{font-weight:700}.city.t3,.city.t4{fill:var(--muted)}
.cdot{fill:var(--ink);stroke:var(--land);opacity:.75}
.mapchips{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;max-width:calc(100% - 70px)}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chip b{color:var(--accent)}
.mapctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.mapcard{position:absolute;left:12px;bottom:14px;right:96px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow)}
.mapcard h3{font-size:16px}
.mapcard .m{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.mapnote{position:absolute;left:12px;bottom:6px;font-size:10.5px;color:var(--muted);opacity:.9;pointer-events:none}
.mapempty{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;max-width:78%;box-shadow:var(--shadow)}
.mapempty p{margin:4px 0 0;color:var(--muted);font-size:13px}

/* timeline */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
.stat b{display:block;font-family:"Fraunces",Georgia,serif;font-size:19px;color:var(--accent)}
.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.year{font-family:"Fraunces",Georgia,serif;font-size:13px;color:var(--muted);letter-spacing:.12em;margin:16px 0 8px 2px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.tcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:12px;width:100%;text-align:left;display:block}
.tcard::before{content:"";position:absolute;left:-22px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--c,var(--accent));border:3px solid var(--bg);box-sizing:content-box;margin-left:-3px}
.tcard h3{font-size:17px}
.tmeta{font-size:12.5px;color:var(--muted);margin:3px 0 7px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.pill.km{background:color-mix(in srgb,var(--orange) 14%,transparent);color:var(--orange);border-color:color-mix(in srgb,var(--orange) 30%,transparent)}
.thumbrow{display:flex;gap:6px;margin-top:9px}
.thumbrow img{width:62px;height:62px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:36px 20px}
.empty b{display:block;color:var(--ink);font-family:"Fraunces",Georgia,serif;font-size:18px;margin-bottom:4px}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead h2{font-size:19px;text-transform:capitalize}
.calhead .iconbtn{width:34px;height:34px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow span{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;padding:2px 0}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:9px;min-height:56px;padding:4px 3px 3px;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left}
.cell.out{opacity:.4}
.cell.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.cell.sel{outline:2px solid var(--accent);outline-offset:-1px}
.dn{font-size:12px;font-weight:600;padding-left:3px;height:20px;line-height:20px}
.bar{height:5px;border-radius:3px;background:var(--c)}
.more{font-size:9.5px;color:var(--muted);padding-left:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted);margin:10px 2px 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sec{font-family:"Fraunces",Georgia,serif;font-size:15px;margin:16px 2px 8px}
.ev{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.ev .dot{width:10px;border-radius:5px;background:var(--c);flex:none}
.ev h4{margin:0;font-size:14.5px}
.ev .m{font-size:12.5px;color:var(--muted)}
.ev .n{font-size:12.5px;margin-top:3px}

/* start */
.next{background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:14px 15px;margin-bottom:12px;width:100%;text-align:left;display:block}
.next .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;opacity:.85}
.next h3{font-size:20px;margin:3px 0 2px;color:inherit;overflow-wrap:anywhere}
.next .m{font-size:13px;opacity:.92}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:118px;min-width:0}
.tile svg{width:30px;height:30px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-family:"Fraunces",Georgia,serif;font-size:18px;display:block}
.tile .s{font-size:12.5px;color:var(--muted);display:block;overflow-wrap:anywhere}
.tile.alert svg{stroke:var(--danger)}
.tile.alert .s{color:var(--danger)}
.quick{display:flex;flex-direction:column;gap:10px;margin-top:14px}
/* to-do */
.stats.three{grid-template-columns:repeat(3,1fr)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 8px;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px}
.cats button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.todo{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 11px;margin-bottom:8px}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0}
.chk svg{width:16px;height:16px;stroke:var(--bg);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.todo.done .chk{background:var(--green);border-color:var(--green)}
.todo.done .chk svg{opacity:1}
.tbody{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:block}
.tbody h4{margin:0;font-size:15px;overflow-wrap:anywhere}
.todo.done h4{text-decoration:line-through;color:var(--muted)}
.tbody .m{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tbody .n{font-size:13px;margin-top:4px;overflow-wrap:anywhere}
.tag{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}

/* aanmelden en leden */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.authwrap{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(48px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.authcard{width:100%;max-width:380px}
.authcard h1{font-size:30px;margin-bottom:6px;text-wrap:balance}
.authcard p{color:var(--muted);margin:0 0 6px}
.authcard label{display:block;margin-top:12px}
.iconbtn{position:relative}
.badge{position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;background:var(--orange);border:2px solid var(--bg)}
.member{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.member .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.member select{width:auto;max-width:58%}

/* huuraanvragen */
nav button{position:relative}
.navdot{position:absolute;top:6px;left:calc(50% + 7px);width:10px;height:10px;border-radius:50%;background:var(--orange);border:2px solid var(--surface)}
.authcard.wide{max-width:440px}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;margin:0 0 8px -2px;font-size:15px}
.primary.big{width:100%;padding:17px 18px;font-size:17px;border-radius:14px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:26px 0 6px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.fine{font-size:12px;color:var(--muted);margin:10px 0 0}
.hint.ok{color:var(--ink);font-weight:600}
.rgrid{gap:3px}
.rd{aspect-ratio:1;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:9px;font-size:14px;display:grid;place-items:center;padding:0;color:var(--ink)}
.rd.blank{visibility:hidden;border:0}
.rd.off{opacity:.35}
.rd.busy{background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--muted) 35%,transparent) 4px 6px);color:var(--muted);text-decoration:line-through;border-color:var(--line)}
.rd.today{outline:1.5px solid var(--accent);outline-offset:-2px}
.rd.mid{background:color-mix(in srgb,var(--accent) 20%,var(--surface));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.rd.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.rd:focus-visible,.back:focus-visible,.primary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend i.hatch{background:repeating-linear-gradient(135deg,transparent 0 2px,color-mix(in srgb,var(--muted) 60%,transparent) 2px 3px);border:1px solid var(--line)}
.next.reqcard{background:var(--orange);color:#1f1408}
.seg .cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--orange);color:#1f1408;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.rq{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px}
.rqh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rqh h4{margin:0;font-size:16px;min-width:0;overflow-wrap:anywhere}
.rq .m{font-size:12.5px;color:var(--muted);margin-top:3px}
.rq .n{font-size:13px;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.rqc{font-size:13.5px;margin-top:4px;overflow-wrap:anywhere}
.rqc a{color:var(--accent)}
.rq .actions{margin-top:12px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sheet h2{font-size:21px;margin-bottom:12px}
.sheet label,.sheet .field{display:block;margin-bottom:12px}
.lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
input:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:0}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:16px}
.actions button{flex:1}
.primary,.ghost,.danger,.small{border-radius:12px;padding:12px 14px;border:1px solid var(--line);font-weight:600}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.primary:disabled{opacity:.55}
.ghost{background:transparent}
.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.small{padding:6px 11px;font-size:13px;background:var(--bg);font-weight:500}
.stoprow{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.stoprow .num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.stoprow .nm{flex:1;min-width:0}
.stoprow .nm small{display:block;color:var(--muted);font-size:11px}
.stoprow button{border:0;background:none;color:var(--muted);font-size:18px;padding:2px 6px}
.addstop{display:flex;gap:8px}
.addstop button{white-space:nowrap}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugs button,.mini button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px}
.mini{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.hint.err{color:var(--danger)}
.warn{background:color-mix(in srgb,var(--orange) 14%,transparent);border:1px solid color-mix(in srgb,var(--orange) 40%,transparent);border-radius:10px;padding:9px 11px;font-size:13px;margin-top:10px}
details{margin-top:8px;font-size:13px}
details summary{color:var(--muted);cursor:pointer}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.ph{position:relative;width:76px;height:76px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-size:13px;line-height:1}
.ph.gone img{opacity:.25}
.filebtn{display:inline-block;border:1px dashed var(--accent);color:var(--accent);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.kinds{display:flex;gap:6px;flex-wrap:wrap}
.kinds button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13.5px}
.kinds button.on{background:var(--c);color:var(--bg);border-color:var(--c)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.dgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.notes{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.94)}
.lbtrack{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.lbtrack::-webkit-scrollbar{display:none}
.lbslide{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:grid;place-items:center;padding:56px 10px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}
.lbclose,.lbnav{position:absolute;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:50%;width:42px;height:42px;font-size:22px;line-height:1;display:grid;place-items:center;cursor:pointer}
.lbclose{top:12px;right:12px}
.lbnav{top:50%;transform:translateY(-50%);font-size:30px;padding-bottom:3px}.lbnav.prev{left:10px}.lbnav.next{right:10px}
@media (hover:none){.lbnav{display:none}}
.lbcount{position:absolute;top:20px;left:0;right:0;text-align:center;color:#fff;font-size:14px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.spot{display:flex;gap:11px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px;margin-bottom:9px;color:inherit}
.spot img,.spot .noimg{width:88px;height:88px;flex:none;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.spot .noimg{display:grid;place-items:center;font-size:30px;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.spot .sb{min-width:0;flex:1}.spot h4{margin:0 0 2px;font-size:15.5px}.spot .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.spot .n{font-size:13px;color:var(--ink);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.heart{color:var(--danger)}
.locbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.locbtn .lt{font-weight:600;font-size:15px}.locbtn .ls{font-size:12.5px;color:var(--muted)}
.sugs.vert{flex-direction:column;align-items:stretch;gap:4px}.sugs.vert button{text-align:left;border-radius:10px;padding:9px 12px;font-size:14px;background:var(--surface)}
.linkbtn+.linkbtn{margin-top:8px}
.picker{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column}
.pkbar{position:relative;display:flex;gap:8px;padding:10px;background:var(--surface);border-bottom:1px solid var(--line);z-index:3}
.pkbar input{flex:1;min-width:0}.pkx{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:42px;font-size:20px}
.pksugs{position:absolute;left:10px;right:10px;top:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.pksugs:empty{display:none}.pksugs button{text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 12px;font-size:14px}.pksugs .hint{padding:10px 12px}
.pktip{padding:7px 12px;font-size:12.5px;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--line);line-height:1.35}.pktip a{color:var(--accent);font-weight:600}
.pkmap{flex:1;position:relative;overflow:hidden;touch-action:none;background:#e6e2d8;cursor:crosshair}
.pkmap img{position:absolute;width:256px;height:256px;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pkpin{position:absolute;font-size:32px;line-height:1;transform:translate(-50%,-92%);pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.pkctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.pkctl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.pkattr{position:absolute;left:6px;bottom:4px;font-size:10.5px;background:rgba(255,255,255,.75);color:#333;padding:1px 5px;border-radius:4px;pointer-events:none}
.pkfoot{display:flex;align-items:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.pkfoot span{flex:1;font-size:13px;color:var(--muted)}
.favbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600}
.favbtn.on{background:color-mix(in srgb,var(--danger) 12%,transparent);border-color:var(--danger);color:var(--danger)}
.linkbtn{display:flex;align-items:center;justify-content:center;margin-top:14px;padding:11px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--accent);font-weight:600;background:var(--surface)}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:90;font-size:13.5px;box-shadow:var(--shadow);max-width:88%;text-align:center}
.banner{margin:10px 16px 0;padding:9px 12px;border-radius:10px;background:color-mix(in srgb,var(--orange) 14%,transparent);border:1px solid color-mix(in srgb,var(--orange) 35%,transparent);font-size:13px}
.roles{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:6px}
.roles b{color:var(--ink)}
</style>
</head>

const isPhotoPath = p => /^(trips|spots)\/[^/]+\/photos(\/|$)/.test(p);
const parentOf = p => p.replace(/\/[^/]+$/, '');
const lastOf = p => p.split('/').pop();
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function mapErr(e) {
  const c = e && (e.code || e.status);
  if (c === '42501' || c === 'PGRST301' || c === 401 || c === 403 || c === 'invalid_argument') return { code: 'invalid_argument', message: (e && e.message) || '' };
  return { code: 'unavailable', message: (e && e.message) || '' };
}

function makeDb(sb) {
  const collSubs = new Set(), docSubs = new Set();
  async function fetchColl(coll) {
    const m = coll.match(/^(?:trips|spots)\/([^/]+)\/photos$/);
    if (m) {
      const { data, error } = await sb.from('photos').select('id,data').eq('trip_id', m[1]);
      if (error) throw mapErr(error);
      return (data || []).map(r => ({ id: r.id, data: r.data }));
    }
    const { data, error } = await sb.from('docs').select('path,data').eq('coll', coll);
    if (error) throw mapErr(error);
    return (data || []).map(r => ({ id: lastOf(r.path), data: r.data }));
  }
  async function fetchDoc(path) {
    if (isPhotoPath(path)) {
      const { data, error } = await sb.from('photos').select('id,data').eq('id', lastOf(path)).maybeSingle();
      if (error) throw mapErr(error);
      return data ? data.data : undefined;
    }
    const { data, error } = await sb.from('docs').select('path,data').eq('path', path).maybeSingle();
    if (error) throw mapErr(error);
    return data ? data.data : undefined;
  }
  function dispatch(type, path, data) {
    if (!path || isPhotoPath(path)) return;
    const coll = parentOf(path);
    collSubs.forEach(s => { if (s.coll === coll) s.apply(type, lastOf(path), data); });
    docSubs.forEach(s => { if (s.path === path) s.apply(type, data); });
  }
  async function putDoc(path, data) {
    const q = isPhotoPath(path)
      ? sb.from('photos').upsert({ id: lastOf(path), trip_id: path.split('/')[1], data }, { onConflict: 'id' })
      : sb.from('docs').upsert({ path, data, updated_at: new Date().toISOString() }, { onConflict: 'path' });
    const { error } = await q;
    if (error) throw mapErr(error);
    dispatch('set', path, data);
  }
  async function removeDoc(path) {
    const q = isPhotoPath(path) ? sb.from('photos').delete().eq('id', lastOf(path)) : sb.from('docs').delete().eq('path', path);
    const { error } = await q;
    if (error) throw mapErr(error);
    dispatch('delete', path, undefined);
  }
  function onColl(coll, next, error) {
    let items = new Map(), last = null, dead = false, first = true;
    const emit = () => {
      const arr = [...items], sig = JSON.stringify(arr);
      if (sig === last) return;
      last = sig;
      next({ docs: arr.map(([id, d]) => ({ id, exists: true, data: () => d })), size: arr.length, empty: !arr.length });
    };
    const s = {
      coll,
      apply(type, id, data) { if (dead) return; if (type === 'delete') items.delete(id); else items.set(id, data); emit(); },
      async reload() {
        try { const rows = await fetchColl(coll); if (dead) return; items = new Map(rows.map(r => [r.id, r.data])); first = false; emit(); }
        catch (e) { if (!dead && first && error) { first = false; error(e); } }
      }
    };
    collSubs.add(s); s.reload();
    return () => { dead = true; collSubs.delete(s); };
  }
  function onDoc(path, next, error) {
    let cur, last = null, dead = false, first = true;
    const emit = () => {
      const sig = JSON.stringify(cur === undefined ? null : cur);
      if (!first && sig === last) return;
      first = false; last = sig;
      next({ id: lastOf(path), exists: cur !== undefined, data: () => cur });
    };
    const s = {
      path,
      apply(type, data) { if (dead) return; cur = type === 'delete' ? undefined : data; emit(); },
      async reload() {
        try { const d = await fetchDoc(path); if (dead) return; cur = d; emit(); }
        catch (e) { if (!dead && first && error) { first = false; error(e); } }
      }
    };
    docSubs.add(s); s.reload();
    return () => { dead = true; docSubs.delete(s); };
  }
  function reloadAll() { collSubs.forEach(s => s.reload()); docSubs.forEach(s => s.reload()); }
  try {
    sb.channel('docs-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, p => {
        if (p.eventType === 'DELETE') dispatch('delete', p.old && p.old.path, undefined);
        else if (p.new) dispatch('set', p.new.path, p.new.data);
      })
      .subscribe(st => { if (st === 'SUBSCRIBED') reloadAll(); });
  } catch (e) {}
  setInterval(() => { if (!document.hidden) reloadAll(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) reloadAll(); });

  function docRef(path) {
    return {
      id: lastOf(path), path,
      async get() { const d = await fetchDoc(path); return { id: lastOf(path), exists: d !== undefined, data: () => d }; },
      set: data => putDoc(path, data),
      async update(patch) {
        const cur = await fetchDoc(path);
        if (cur === undefined) throw { code: 'invalid_argument', message: 'Document bestaat niet.' };
        return putDoc(path, Object.assign({}, cur, patch));
      },
      delete: () => removeDoc(path),
      onSnapshot: (n, e) => onDoc(path, n, e)
    };
  }
  function collRef(coll) {
    return {
      path: coll,
      doc: id => docRef(coll + '/' + (id || newId())),
      async get() { const rows = await fetchColl(coll); return { docs: rows.map(r => ({ id: r.id, exists: true, data: () => r.data })), size: rows.length, empty: !rows.length }; },
      onSnapshot: (n, e) => onColl(coll, n, e)
    };
  }
  return { doc: docRef, collection: collRef, reload: reloadAll };
}

async function doAuth() {

  const { data, error } = await S.sb.from('members').select('user_id,name,role').eq('user_id', user.id).maybeSingle();
  if (error || !data) {
    showMessage('Account niet gevonden', 'Je profiel is nog niet aangemaakt. Vraag de beheerder om te controleren of de installatie in Supabase (het SQL-bestand) is uitgevoerd.',

    return;
  }
  S.role = data.role; S.me.name = data.name || S.me.name;
  if (S.role === 'pending') {
    showMessage('Bijna binnen', 'Je account is aangemaakt. De beheerder moet je nog toegang geven. Probeer het later opnieuw.',
      '<button class="primary" data-auth="recheck" style="width:100%;margin-top:12px">Opnieuw controleren</button><button class="ghost" data-auth="logout" style="width:100%;margin-top:8px">Uitloggen</button>');
    return;
  }
  $('#auth').innerHTML = '';
  S.db = makeDb(S.sb);
  S.canWrite = S.role === 'member' || S.role === 'admin';
  S.canAdmin = S.role === 'admin';

  if (!S.canWrite && (S.tab === 'agenda' || S.tab === 'todo' || S.tab === 'spots')) S.tab = 'home';
  render();
  const db = S.db;
  const onErr = e => {
    if (e && e.code === 'revoked') { S.error = 'Je toegang is gewijzigd. Open de app opnieuw.'; render(); }
    else if (e && e.code === 'unavailable') { S.error = 'Verbinding met de gegevens mislukt. Herlaad de pagina.'; S.tripsLoaded = true; render(); }
  };
  db.collection('trips').onSnapshot(snap => {
    S.trips = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    S.tripsLoaded = true; resolveNames(); refresh();
  }, onErr);
  db.doc('settings/main').onSnapshot(s => { S.settings = s.exists ? (s.data() || {}) : {}; renderHeader(); }, onErr);
  if (S.canWrite) {
    db.collection('bookings').onSnapshot(snap => {
      S.bookings = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      resolveNames(); refresh();
    }, onErr);
    db.collection('todos').onSnapshot(snap => {
      S.todos = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      resolveNames(); refresh();

    }, onErr);

  }
}

const GEO_URL = 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json';

function buildGeo(t) {
  if (!t || !t.transform || !t.arcs || !t.objects) throw new Error('geo');
  const sc = t.transform.scale, tr = t.transform.translate, X0 = -30, X1 = 60, Y0 = 20, Y1 = 75, TOL = 0.02;
  const arcs = t.arcs.map(a => {
    let x = 0, y = 0, lx = 1e9, ly = 1e9, inside = false; const pts = [];
    for (let i = 0; i < a.length; i++) {
      x += a[i][0]; y += a[i][1];
      const lon = x * sc[0] + tr[0], lat = y * sc[1] + tr[1];

  S.trips.forEach(t => { const a = dayOf(t.start), z = dayOf(t.end || t.start); if (a && a <= ds && ds <= z) ev.push({ type: 't', kind: 'trip', title: t.title, color: 'var(--green)', ref: t }); });
  return ev;
}

  const title = first.toLocaleString('nl-BE', { month: 'long', year: 'numeric' });
  let cells = '';
  for (let i = 0; i < off; i++) cells += '<span class="rd blank"></span>';
  for (let d = 1; d <= dim; d++) {
    const ds = ymd(new Date(R.y, R.m, d)), past = ds < today, busy = !past && isBusy(ds);
    const edge = ds === R.start || ds === R.end, mid = R.start && R.end && ds > R.start && ds < R.end;
    const cls = 'rd' + (past ? ' off' : '') + (busy ? ' busy' : '') + (ds === today ? ' today' : '') + (edge ? ' sel' : '') + (mid ? ' mid' : '');
    cells += '<button type="button" class="' + cls + '" data-req="day" data-d="' + ds + '"' + (past || busy ? ' disabled' : '') + ' aria-label="' + esc(fmtLong(ds)) + (busy ? ', bezet' : '') + '"' + (edge ? ' aria-pressed="true"' : '') + '>' + d + '</button>';
  }
  el.innerHTML = '<div class="calhead"><button type="button" class="iconbtn" data-req="mprev" aria-label="Vorige maand"' + (shown <= cur ? ' disabled style="opacity:.35"' : '') + '>‹</button><h2>' + esc(title) + '</h2><button type="button" class="iconbtn" data-req="mnext" aria-label="Volgende maand"' + (shown >= cur + 18 ? ' disabled style="opacity:.35"' : '') + '>›</button></div>' +
    '<div class="dow">' + ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'].map(d => '<span>' + d + '</span>').join('') + '</div><div class="grid rgrid">' + cells + '</div>' +
    '<div class="legend"><span><i style="background:var(--accent)"></i>Jouw keuze</span><span><i class="hatch"></i>Bezet</span></div>' +
    (R.busyState === 'fail' ? '<div class="hint err">De bezette dagen konden niet geladen worden. Je kunt toch een aanvraag doen. We controleren de beschikbaarheid daarna zelf.</div>' : '');
}
function drawRsum() {
  const el = $('#rsum'); if (!el) return;
  let t, cls = 'hint';
  if (R.hint) { t = R.hint; cls += ' err'; }
  else if (R.start && R.end) { t = 'Van ' + fmtLong(R.start) + ' tot en met ' + fmtLong(R.end) + ' · ' + daysText(diffDays(R.start, R.end)); cls += ' ok'; }
  else if (R.start) t = 'Eerste dag: ' + fmtLong(R.start) + '. Tik nu op je laatste dag, of opnieuw op dezelfde dag voor één dag.';
  else t = 'Tik op je eerste dag en daarna op je laatste dag.';
  el.className = cls; el.textContent = t;
}
function pickDay(ds) {
  if (ds < todayStr() || isBusy(ds)) return;
  R.hint = '';
  if (!R.start || R.end) { R.start = ds; R.end = ''; }
  else if (ds < R.start) { R.start = ds; }
  else if (rangeHasBusy(R.start, ds)) { R.start = ds; R.end = ''; R.hint = 'Tussen die dagen zit een bezette dag. Kies een periode zonder bezette dagen.'; }
  else if (diffDays(R.start, ds) > MAXDAYS) { R.start = ds; R.end = ''; R.hint = 'Je kunt maximaal ' + MAXDAYS + ' dagen per aanvraag kiezen.'; }
  else R.end = ds;
  drawRcal(); drawRsum();
}
async function sendConfirmation(r) {
  const c = window.APP_CONFIG || {};
  if (!c.EMAILJS_SERVICE_ID || !c.EMAILJS_TEMPLATE_ID || !c.EMAILJS_PUBLIC_KEY) return 'off';
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 9000);
  try {
    const n = diffDays(r.start, r.end);
    const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctl.signal,
      body: JSON.stringify({
        service_id: c.EMAILJS_SERVICE_ID, template_id: c.EMAILJS_TEMPLATE_ID, user_id: c.EMAILJS_PUBLIC_KEY,
        template_params: { to_name: r.name, to_email: r.email, start: fmtLong(r.start), end: fmtLong(r.end), days: daysText(n), camper: 'Camper Danny' }
      })
    });
    return res.ok ? 'sent' : 'failed';
  } catch (e) { return 'failed'; } finally { clearTimeout(timer); }
}
async function submitRequest() {
  if (R.sending) return;
  const msg = (t, err) => { const m = $('#r-msg'); if (m) { m.textContent = t || ''; m.className = 'hint' + (err ? ' err' : ''); } };
  const name = R.name.trim(), email = R.email.trim(), phone = R.phone.trim(), note = R.note.trim();
  if (name.length < 2) { msg('Vul je naam in.', true); $('#r-name').focus(); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg('Vul een geldig e-mailadres in.', true); $('#r-email').focus(); return; }
  if (!R.start || !R.end) { msg('Kies eerst de periode in de kalender.', true); return; }
  R.sending = true; const btn = $('#r-go'); btn.disabled = true; msg('Even geduld…');
  try {
    const { data, error } = await S.sb.rpc('submit_request', { p_name: name, p_email: email, p_phone: phone, p_start: R.start, p_end: R.end, p_note: note, p_hp: R.hp });
    if (error) throw error;
    if (!data || !data.ok) {
      const k = data && data.error;
      msg(REQ_ERR[k] || 'Controleer je gegevens en probeer opnieuw.', true);
      if (k === 'busy') { R.start = ''; R.end = ''; R.hint = ''; drawRsum(); await loadBusy(); }
      R.sending = false; btn.disabled = false; return;
    }
    const r = { name, email, phone, start: R.start, end: R.end };
    const mail = R.hp ? 'off' : await sendConfirmation(r);
    showRequestDone(r, mail);
  } catch (e) {
    R.sending = false; btn.disabled = false;
    msg('Versturen is niet gelukt. Controleer je verbinding en probeer opnieuw.', true);
  }
}
function showRequestDone(r, mail) {
  const n = diffDays(r.start, r.end);
  authShell('<h1>Bedankt, ' + esc(r.name.split(/\s+/)[0]) + '!</h1><p>We hebben je aanvraag ontvangen.</p>' +
    '<div class="roles" style="margin:12px 0"><b>' + esc(fmtLong(r.start)) + (n ? ' tot en met ' + esc(fmtLong(r.end)) : '') + '</b><br>' + esc(daysText(n)) + '<br>' + esc(r.email) + (r.phone ? ' · ' + esc(r.phone) : '') + '</div>' +
    (mail === 'sent' ? '<p>We stuurden een bevestiging naar <b>' + esc(r.email) + '</b>. Zie je niets, kijk dan ook in je spam.</p>' : '') +
    (mail === 'failed' ? '<p>De bevestigingsmail kon niet verstuurd worden, maar je aanvraag is wel aangekomen.</p>' : '') +
    '<p>We nemen zo snel mogelijk contact met je op. Je aanvraag is pas definitief nadat we die hebben goedgekeurd.</p>' +
    '<button class="primary big" type="button" data-req="done" style="margin-top:12px">Klaar</button>', true);
  const w = $('#auth .authwrap'); if (w) w.scrollTop = 0;
}
async function reEnter() {
  try { const { data } = await S.sb.auth.getSession(); if (data.session) afterLogin(data.session.user); else showAuth('in'); } catch (e) { showAuth('in'); }
}
function closeRequest() {
  try { history.replaceState(history.state, '', location.pathname + location.search); } catch (e) {}
  if (S.db) { $('#auth').innerHTML = ''; return; }
  reEnter();
}

/* ---------- huuraanvragen: beheren in de app ---------- */
const publicLink = () => location.href.split('#')[0].replace(/index\.html$/, '') + '#huur';
function copyLink() {
  const l = publicLink();
  try { navigator.clipboard.writeText(l).then(() => toast('Link gekopieerd ✓'), () => toast(l)); } catch (e) { toast(l); }
}
async function loadRequests() {
  if (!S.sb || !S.canWrite) return;
  try {
    const { data, error } = await S.sb.from('requests').select('*').order('created_at', { ascending: false });
    if (error || !data) return;
    const sig = JSON.stringify(data.map(r => [r.id, r.status]));
    const prev = S.reqLoaded ? new Set(S.requests.map(r => r.id)) : null;
    if (S.reqLoaded && sig === S.reqSig) return;
    S.reqSig = sig; S.requests = data; S.reqLoaded = true;
    S.newReqCount = data.filter(r => r.status === 'new').length;
    if (prev) data.filter(r => r.status === 'new' && !prev.has(r.id)).forEach(r => toast('Nieuwe huuraanvraag van ' + r.name));
    refresh();
  } catch (e) {}
}
let rqLive = false;
function startRequestLive() {
  if (rqLive) return; rqLive = true;
  try { S.sb.channel('requests-live').on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, () => loadRequests()).subscribe(); } catch (e) {}
  setInterval(() => { if (!document.hidden) loadRequests(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadRequests(); });
}
function reqSeg() {
  return '<div class="seg"><button class="' + (S.reqTab !== 'req' ? 'on' : '') + '" data-act="reqtab" data-k="cal">Kalender</button><button class="' + (S.reqTab === 'req' ? 'on' : '') + '" data-act="reqtab" data-k="req">Aanvragen' + (S.newReqCount ? ' <b class="cnt">' + S.newReqCount + '</b>' : '') + '</button></div>';
}
const rqConflicts = r => S.bookings.filter(b => b.start <= r.end_date && r.start_date <= (b.end || b.start));
function rqHTML(r) {
  const n = diffDays(r.start_date, r.end_date), isNew = r.status === 'new', cf = isNew ? rqConflicts(r) : [];
  const tag = isNew ? '<span class="tag" style="--c:var(--orange)">Nieuw</span>' : r.status === 'approved' ? '<span class="tag" style="--c:var(--green)">Goedgekeurd</span>' : '<span class="tag" style="--c:var(--muted)">Afgewezen</span>';
  const tel = String(r.phone || '').replace(/[^0-9+]/g, ''), id = esc(r.id);
  return '<div class="rq"><div class="rqh"><h4>' + esc(r.name) + '</h4>' + tag + '</div>' +
    '<div class="m">' + esc(fmtRange(r.start_date, r.end_date)) + ' · ' + esc(daysText(n)) + '</div>' +
    '<div class="rqc"><a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a>' + (r.phone ? ' · <a href="tel:' + esc(tel) + '">' + esc(r.phone) + '</a>' : '') + '</div>' +
    (r.note ? '<div class="n">' + esc(r.note) + '</div>' : '') +
    (cf.length ? '<div class="warn">Overlapt met: ' + cf.map(b => esc(b.title) + ' (' + esc(fmtRange(b.start, b.end)) + ')').join(', ') + '</div>' : '') +
    '<div class="m">Ingediend op ' + esc(fmtDate(r.created_at, true)) + '</div>' +
    (isNew ? '<div class="actions"><button class="danger" data-act="rqreject" data-id="' + id + '">Afwijzen</button><button class="primary" data-act="rqapprove" data-id="' + id + '">Goedkeuren</button></div>'
      : '<div class="actions"><button class="ghost" data-act="rqdel" data-id="' + id + '">Verwijder gegevens</button></div>') + '</div>';
}
function requestsView() {
  const nw = S.requests.filter(r => r.status === 'new'), done = S.requests.filter(r => r.status !== 'new');
  return '<div class="scroll">' + reqSeg() +
    '<div class="sec" style="margin-top:4px">Nieuw' + (nw.length ? ' (' + nw.length + ')' : '') + '</div>' +
    (nw.length ? nw.map(rqHTML).join('') : '<div class="hint" style="margin:0 0 6px 2px">Geen nieuwe aanvragen.</div>') +
    (done.length ? '<div class="sec">Behandeld</div>' + done.map(rqHTML).join('') : '') +
    '<div class="roles" style="margin-top:14px"><b>Link voor klanten</b><br><span style="overflow-wrap:anywhere">' + esc(publicLink()) + '</span><br><button class="small" style="margin-top:8px" data-act="copylink">Link kopiëren</button></div></div>';
}
function openDecision(id, approve) {
  const r = S.requests.find(x => x.id === id); if (!r) return;
  const cf = approve ? rqConflicts(r) : [];
  openSheet('<h2>' + (approve ? 'Aanvraag goedkeuren?' : 'Aanvraag afwijzen?') + '</h2>' +
    '<p style="margin:0 0 8px"><b>' + esc(r.name) + '</b><br>' + esc(fmtRange(r.start_date, r.end_date)) + '</p>' +
    (approve ? '<p style="margin:0 0 8px">De periode komt als <b>Gereserveerd</b> in de agenda.</p>' : '') +
    '<p style="margin:0 0 4px">De aanvrager krijgt hierover geen automatische mail. Neem zelf contact op via <b>' + esc(r.email) + '</b>' + (r.phone ? ' of ' + esc(r.phone) : '') + '.</p>' +
    (cf.length ? '<div class="warn"><b>Let op, dit overlapt:</b><br>' + cf.map(b => esc(b.title) + ' (' + esc(fmtRange(b.start, b.end)) + ')').join('<br>') + '</div>' : '') +
    '<div class="actions"><button class="ghost" data-act="close">Annuleer</button><button class="' + (approve ? 'primary' : 'danger') + '" data-act="rqdo" data-id="' + esc(id) + '" data-ok="' + (approve ? '1' : '0') + '">' + (approve ? (cf.length ? 'Toch goedkeuren' : 'Goedkeuren') : 'Afwijzen') + '</button></div>', 'rqconfirm');
}
let rqBusy = false;
async function decide(id, ok) {
  if (rqBusy) return; rqBusy = true;
  try {
    const { data, error } = await S.sb.rpc('decide_request', { p_id: id, p_approve: ok });
    if (error) throw error;
    const k = data && data.error;
    if (!data || !data.ok) toast(k === 'already' ? 'Deze aanvraag is al behandeld.' : k === 'forbidden' ? 'Je hebt hier geen rechten voor.' : 'Dat lukte niet. Probeer opnieuw.');
    else toast(ok ? 'Goedgekeurd en in de agenda gezet ✓' : 'Aanvraag afgewezen');
    closeSheet(); await loadRequests(); if (S.db && S.db.reload) S.db.reload();
  } catch (e) { toast('Dat lukte niet. Controleer je verbinding.'); }
  finally { rqBusy = false; }
}
async function deleteRequest(id) {
  try {
    const { error } = await S.sb.from('requests').delete().eq('id', id);
    if (error) throw error;
    closeSheet(); toast('Gegevens verwijderd'); S.reqSig = ''; await loadRequests();
  } catch (e) { toast('Verwijderen is niet gelukt.'); }
}

document.addEventListener('input', e => { const t = e.target; if (t.id && /^r-(name|email|phone|note|hp)$/.test(t.id)) R[t.id.slice(2)] = t.value; });
document.addEventListener('submit', e => { if (e.target.id === 'reqform') { e.preventDefault(); submitRequest(); } });
document.addEventListener('click', e => {
  const a = e.target.closest('[data-req]'); if (!a) return;
  switch (a.dataset.req) {
    case 'open': pushStep(); showRequest(); break;
    case 'back': case 'done': closeRequest(); break;
    case 'day': pickDay(a.dataset.d); break;
    case 'mprev': R.m--; if (R.m < 0) { R.m = 11; R.y--; } drawRcal(); break;
    case 'mnext': R.m++; if (R.m > 11) { R.m = 0; R.y++; } drawRcal(); break;
  }
});

/* ---------- events ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.f && S.F) S.F[t.dataset.f] = t.value;
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'photoin' || !S.F) return;
  const files = [...e.target.files]; e.target.value = '';
  const msg = $('#photomsg');
  for (let i = 0; i < files.length; i++) {
    if (msg) msg.textContent = 'Foto ' + (i + 1) + '/' + files.length + ' verkleinen…';
    try { S.F.newPhotos.push(await prep(files[i])); } catch (x) { toast('Eén foto kon niet gelezen worden.'); }
  }
  if (msg) msg.textContent = ''; renderPhotos();
});
document.addEventListener('keydown', e => { const lb = $('.lightbox'); if (lb && lb._go && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { lb._go(e.key === 'ArrowLeft' ? -1 : 1); return; }
  if (e.key === 'Escape') { if ($('.picker')) { $('.picker').remove(); return; } if ($('.lightbox')) $('.lightbox').remove(); else if (S.sheetKind) closeSheet(); } });
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  if (act === 'scrim') { if (e.target === a) closeSheet(); return; }
  if (act === 'lightbox') {
    const l = S.photoCache[id]; if (!l) return; const i = l.items.findIndex(x => x.id === a.dataset.p); if (i < 0) return;
    openGallery(l.items, i); return;
  }
  switch (act) {
    case 'tab': goTab(a.dataset.t); break;
    case 'close': closeSheet(); break;
    case 'zin': { const r = $('#mapwrap').getBoundingClientRect(); zoomAt(0.6, r.left + r.width / 2, r.top + r.height / 2); break; }
    case 'zout': { const r = $('#mapwrap').getBoundingClientRect(); zoomAt(1.65, r.left + r.width / 2, r.top + r.height / 2); break; }
    case 'zfit': fitMap(); S.selTrip = null; S.selSpot = null; drawMap(); drawCard(); break;
    case 'detail': openDetail(id); break;
    case 'newtrip': openTripForm(null); break;
    case 'edittrip': openTripForm(id); break;
    case 'deltrip': confirmSheet('Deze reis en al zijn foto’s worden definitief verwijderd.', 'Ja, verwijder', 'deltrip2', id); break;
    case 'deltrip2': deleteTrip(id); break;
    case 'savetrip': saveTrip(); break;
    case 'stopdel': S.F.stops.splice(+a.dataset.i, 1); renderStops(); break;
    case 'stopup': { const i = +a.dataset.i; if (i > 0) { const s = S.F.stops; [s[i - 1], s[i]] = [s[i], s[i - 1]]; renderStops(); } break; }
    case 'phdel': S.F.newPhotos.splice(+a.dataset.i, 1); renderPhotos(); break;
    case 'phtoggle': S.F.remove[id] = !S.F.remove[id]; renderPhotos(); break;
    case 'cprev': { S.cal.m--; if (S.cal.m < 0) { S.cal.m = 11; S.cal.y--; } renderView(); break; }
    case 'cnext': { S.cal.m++; if (S.cal.m > 11) { S.cal.m = 0; S.cal.y++; } renderView(); break; }
    case 'selday': S.cal.sel = a.dataset.d; { const d = new Date(a.dataset.d + 'T00:00:00'); S.cal.y = d.getFullYear(); S.cal.m = d.getMonth(); } renderView(); break;
    case 'newbooking': openBookingForm(null); break;
    case 'editbooking': openBookingForm(id); break;

    case 'delbooking': confirmSheet('Deze boeking wordt verwijderd uit de agenda.', 'Ja, verwijder', 'delbooking2', id); break;
    case 'delbooking2': S.db.doc('bookings/' + id).delete().then(() => { closeSheet(); toast('Boeking verwijderd'); }).catch(dbFail); break;
    case 'newspot': openSpotForm(null); break;
    case 'editspot': openSpotForm(id); break;
    case 'spot': openSpot(id); break;
    case 'savespot': saveSpot(); break;
    case 'spotmap': openPicker({ lat: S.F.lat, lon: S.F.lon, onPick: nameFromCoords }); break;
    case 'stopmap': { const l = S.F.stops[S.F.stops.length - 1]; openPicker({ lat: l ? l.lat : null, lon: l ? l.lon : null, pin: false, onPick: addStopFromPick }); break; }
    case 'spotfav': S.F.fav = !S.F.fav; a.className = 'favbtn' + (S.F.fav ? ' on' : ''); a.textContent = S.F.fav ? '♥ Zeker nog eens naartoe' : '♡ Zeker nog eens naartoe?'; break;
    case 'sfilter': S.spotFav = a.dataset.k === 'fav'; renderView(); break;
    case 'delspot': confirmSheet('Deze spot en al zijn foto’s worden definitief verwijderd.', 'Ja, verwijder', 'delspot2', id); break;
    case 'delspot2': deleteSpot(id); break;
    case 'newtodo': openTodoForm(null); break;
    case 'edittodo': openTodoForm(id); break;
    case 'ttoggle': toggleTodo(id); break;
    case 'tkind': case 'tprio': { S.F[act === 'tkind' ? 'kind' : 'prio'] = a.dataset.k; const sh = $('#sheet .sheet'), sc = sh.scrollTop; sh.innerHTML = todoFormHTML(); sh.scrollTop = sc; break; }
    case 'tcat': S.todoCat = a.dataset.k; renderView(); break;
    case 'tshow': S.todoShow = a.dataset.k; renderView(); break;
    case 'savetodo': saveTodo(); break;
    case 'deltodo': confirmSheet('Dit punt wordt verwijderd uit de lijst.', 'Ja, verwijder', 'deltodo2', id); break;
    case 'deltodo2': S.db.doc('todos/' + id).delete().then(() => { closeSheet(); toast('Punt verwijderd'); }).catch(dbFail); break;
    case 'openreq': S.reqTab = 'req'; goTab('agenda'); break;
    case 'reqtab': S.reqTab = a.dataset.k; renderView(); break;
    case 'rqapprove': openDecision(id, true); break;
    case 'rqreject': openDecision(id, false); break;
    case 'rqdo': decide(id, a.dataset.ok === '1'); break;
    case 'rqdel': confirmSheet('Alle gegevens van deze aanvrager worden definitief verwijderd.', 'Ja, verwijder', 'rqdel2', id); break;
    case 'rqdel2': deleteRequest(id); break;
    case 'copylink': copyLink(); break;
    case 'settings': openSettings(); break;
    case 'savesettings': saveSettings(); break;
  }
});
window.addEventListener('resize', () => { if (S.tab === 'map' && $('#mapwrap')) drawMap(); });

/* ---------- terug-knop en veegbeweging: naar het vorige scherm ---------- */
S.tabHist = [];
function goTab(t, fromBack) {
  if (!fromBack && S.tab !== t) { S.tabHist.push(S.tab); if (S.tabHist.length > 30) S.tabHist.shift(); pushStep(); }
  S.tab = t; if (t === 'map') M.fitted = false; renderView(); renderNav();
}
function handleBack() {
  const lb = $('.lightbox'); if (lb) { lb.remove(); return true; }
  const pk = $('.picker'); if (pk) { pk.remove(); return true; }
  if ($('#sheet .sheet')) { closeSheet(); return true; }
  if ($('#reqform')) { closeRequest(); return true; }
  if (S.db && S.tabHist.length) { goTab(S.tabHist.pop(), true); return true; }
  if (S.db && S.tab !== 'home') { goTab('home', true); return true; }
  return false;
}
// Elke stap vooruit (ander tabblad, venster, kaartkiezer, foto) zet bij de tik een stap in de geschiedenis van de browser.
// Zo telt de terug-knop van de gsm die stappen mee, en sluit de app niet meteen. (Stappen die de pagina zelf zonder tik
// toevoegt, slaat Chrome over; daarom gebeurt dit altijd direct bij een tik.) Sluit je iets met een knop, dan blijft de
// stap in de geschiedenis staan; die wordt bij terug stilletjes overgeslagen tot je echt de app verlaat.
let NAVI = 0;
function pushStep() { try { NAVI++; history.pushState({ i: NAVI }, '', location.href); } catch (e) {} }
try {
  NAVI = (history.state && history.state.i) || 0;
  if (!history.state || history.state.i == null) history.replaceState({ i: 0 }, '', location.href);
  window.addEventListener('popstate', e => {
    const ni = (e.state && e.state.i) || 0;
    if (ni >= NAVI) { NAVI = ni; return; }
    NAVI = ni;
    if (!handleBack()) { try { history.back(); } catch (x) {} }
  });
} catch (e) {}

try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
boot();
